<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Forge · Help</title>
<style>
  :root {
    --bg:#0f1117; --panel:#171a23; --line:#262b38; --ink:#e6e9f0; --dim:#8a92a6;
    --accent:#6fd3ff; --good:#67e39b; --bad:#ff6b6b; --gold:#ffd86b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
  }
  header {
    padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5;
  }
  .brand { font-weight:700; letter-spacing:.14em; font-size:14px; }
  .brand span { color:var(--accent); }
  header a {
    color:var(--dim); text-decoration:none; font-size:13px;
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  header a:hover { color:var(--accent); border-color:var(--accent); }
  .grow { flex:1; }

  main { flex:1; overflow-y:auto; padding:16px; max-width:760px; width:100%; margin:0 auto; }

  #q {
    width:100%; background:#0d0f16; color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; font-size:17px; font-family:inherit;
    margin-bottom:6px;
  }
  #q:focus { outline:none; border-color:var(--accent); }
  .qhint { color:var(--dim); font-size:12.5px; margin-bottom:18px; }

  /* live diagnosis, right at the top where a stuck person will see it */
  .doc { border:1px solid var(--line); border-radius:12px; background:var(--panel);
         padding:14px 16px; margin-bottom:20px; }
  .doc h2 { font-size:12px; text-transform:uppercase; letter-spacing:.14em;
            color:var(--dim); margin:0 0 10px; }
  .row { display:flex; gap:10px; align-items:flex-start; padding:5px 0;
         border-top:1px solid #1e2331; }
  .row:first-of-type { border-top:0; }
  .pill { font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:5px;
          flex-shrink:0; margin-top:2px; letter-spacing:.06em; }
  .ok   { background:#123322; color:var(--good); }
  .warn { background:#33280f; color:var(--gold); }
  .fail { background:#3a1a1a; color:var(--bad); }
  .rname { font-weight:600; }
  .rdet { color:var(--dim); font-size:13.5px; }
  .fix { margin-top:5px; }
  .fix code {
    background:#0d0f16; border:1px solid var(--line); color:var(--accent);
    padding:6px 9px; border-radius:7px; font-size:13px; display:inline-block;
    cursor:pointer; font-family:ui-monospace, monospace;
  }
  .fix code:hover { border-color:var(--accent); }
  .fixlabel { color:var(--dim); font-size:12px; margin-right:4px; }

  .topic { border:1px solid var(--line); border-radius:12px; background:var(--panel);
           margin-bottom:10px; overflow:hidden; }
  .topic > h3 {
    margin:0; padding:14px 16px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .topic > h3 .blurb { color:var(--dim); font-size:13px; font-weight:400; flex:1; }
  .topic > h3::after { content:'▾'; color:var(--dim); transition:transform .15s; }
  .topic.open > h3::after { transform:rotate(180deg); }
  .topic .body { display:none; padding:0 16px 16px; white-space:pre-wrap;
                 font-size:15px; color:#cdd3e0; }
  .topic.open .body { display:block; }
  .topic .body code, .topic .body .cmd {
    background:#0d0f16; border:1px solid var(--line); color:var(--accent);
    padding:2px 6px; border-radius:5px; font-family:ui-monospace, monospace;
    font-size:13.5px;
  }
  .cmdline {
    display:block; background:#0d0f16; border:1px solid var(--line);
    color:var(--accent); padding:9px 12px; border-radius:8px; margin:6px 0;
    font-family:ui-monospace, monospace; font-size:13.5px; cursor:pointer;
    white-space:pre-wrap; word-break:break-all;
  }
  .cmdline:hover { border-color:var(--accent); }
  mark { background:#3a4a1a; color:var(--gold); border-radius:3px; }
  #none { color:var(--dim); padding:20px 0; }
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--good); color:var(--good);
    padding:9px 16px; border-radius:9px; font-size:13.5px; opacity:0;
    transition:opacity .2s; pointer-events:none;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="brand">FOR<span>GE</span> · HELP</div>
  <div class="grow"></div>
  <a href="/chat" id="lChat">Chat</a>
  <a href="/bricks" id="lBricks">Bricks</a>
  <a href="/" id="lSettings">Settings</a>
</header>

<main>
  <input id="q" placeholder="What are you stuck on?" autocomplete="off">
  <div class="qhint">Type anything — "it's slow", "phone", "how do I switch models".
    Or just browse below.</div>

  <div class="doc" id="doc">
    <h2>Your setup, right now</h2>
    <div id="docrows" style="color:var(--dim);font-size:13.5px">checking…</div>
  </div>

  <div id="topics"></div>
  <div id="none" style="display:none"></div>
</main>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = new URLSearchParams(location.search).get('token')
            || localStorage.getItem('forge-token') || '';
if (new URLSearchParams(location.search).get('token')) {
  localStorage.setItem('forge-token', TOKEN);
  history.replaceState({}, '', location.pathname);
}
// keep the token on the nav links so tapping through doesn't lock you out
for (const id of ['lChat','lBricks','lSettings']) {
  if (TOKEN) $(id).href += (($(id).getAttribute('href').includes('?')) ? '&' : '?')
                           + 'token=' + encodeURIComponent(TOKEN);
}
const q = p => p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
const api = p => fetch(q(p)).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });

const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function toast(m) {
  const t = $('toast'); t.textContent = m; t.className = 'show';
  setTimeout(() => t.className = '', 1800);
}
function copy(text) {
  navigator.clipboard?.writeText(text).then(() => toast('Copied'))
    .catch(() => toast(text));
}

/* ---- live diagnosis ------------------------------------------------ */
async function loadDoctor() {
  try {
    const d = await api('/api/doctor');
    const bad = d.checks.filter(c => c.status === 'fail');
    const meh = d.checks.filter(c => c.status === 'warn');
    const box = $('docrows');
    box.innerHTML = '';

    // problems first — nobody scrolls past a wall of green to find the red
    const show = [...bad, ...meh, ...d.checks.filter(c => c.status === 'ok')];
    for (const c of show) {
      const row = document.createElement('div');
      row.className = 'row';
      const cls = c.status === 'ok' ? 'ok' : (c.status === 'warn' ? 'warn' : 'fail');
      const word = c.status === 'ok' ? 'OK' : (c.status === 'warn' ? 'OPTIONAL' : 'PROBLEM');
      row.innerHTML =
        `<span class="pill ${cls}">${word}</span>` +
        `<div><div class="rname">${esc(c.name)}</div>` +
        `<div class="rdet">${esc(c.detail)}</div>` +
        (c.fix ? `<div class="fix"><span class="fixlabel">run this:</span>` +
                 `<code data-cmd="${esc(c.fix)}">${esc(c.fix)}</code></div>` : '') +
        `</div>`;
      box.appendChild(row);
    }
    for (const el of box.querySelectorAll('code[data-cmd]')) {
      el.onclick = () => copy(el.dataset.cmd);
    }
    const head = $('doc').querySelector('h2');
    head.textContent = bad.length ? `Your setup — ${bad.length} problem(s)`
      : (meh.length ? 'Your setup — all good' : 'Your setup — all good');
    head.style.color = bad.length ? 'var(--bad)' : 'var(--good)';
  } catch (e) {
    $('docrows').textContent = 'Could not check (' + e.message + ')';
  }
}

/* ---- topics -------------------------------------------------------- */
let HELP = null;

function renderTopics(filter) {
  const box = $('topics');
  box.innerHTML = '';
  const words = (filter || '').toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;

  for (const key of HELP.order) {
    const t = HELP.topics[key];
    const hay = (key + ' ' + t.title + ' ' + t.blurb + ' ' + t.body).toLowerCase();
    if (words.length && !words.every(w => hay.includes(w))) continue;
    shown++;

    const el = document.createElement('div');
    el.className = 'topic' + (words.length ? ' open' : '');
    // pull command-looking lines out so they're tappable to copy
    const body = esc(t.body).split('\n').map(line => {
      if (/^\s{4}\S/.test(line)) {
        const cmd = line.trim();
        return `<span class="cmdline" data-cmd="${cmd}">${cmd}</span>`;
      }
      return line;
    }).join('\n');
    el.innerHTML =
      `<h3>${esc(t.title)}<span class="blurb">${esc(t.blurb)}</span></h3>` +
      `<div class="body">${body}</div>`;
    el.querySelector('h3').onclick = () => el.classList.toggle('open');
    for (const c of el.querySelectorAll('.cmdline')) {
      c.onclick = e => { e.stopPropagation(); copy(c.dataset.cmd); };
    }
    box.appendChild(el);
  }

  if (words.length) {
    for (const el of box.querySelectorAll('.body, h3')) {
      for (const w of words) {
        el.innerHTML = el.innerHTML.replace(
          new RegExp('(?![^<]*>)(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
          '<mark>$1</mark>');
      }
    }
  }

  $('none').style.display = shown ? 'none' : 'block';
  $('none').textContent = shown ? '' :
    `Nothing about "${filter}". Try fewer words — or check the setup box above, ` +
    `which shows what's actually wrong right now.`;
}

let timer = null;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => renderTopics($('q').value.trim()), 120);
});

(async function init() {
  try {
    HELP = await api('/api/help');
    renderTopics('');
  } catch (e) {
    $('topics').innerHTML = '<div style="color:var(--bad)">Could not load help: '
      + esc(e.message) + '</div>';
  }
  loadDoctor();
  setInterval(loadDoctor, 20000);
})();
</script>
</body>
</html>
