<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Forge · Bricks</title>
<style>
  :root {
    --bg:#0f1117; --panel:#171a23; --line:#262b38; --ink:#e6e9f0; --dim:#8a92a6;
    --accent:#6fd3ff; --good:#67e39b; --bad:#ff6b6b; --gold:#ffd86b;
    --agent:#3b6ea5; --ask:#7a5ea8; --command:#3f7d5c; --loop:#a8722e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
  }

  header {
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand { font-weight:700; letter-spacing:.14em; font-size:14px; }
  .brand span { color:var(--accent); }
  header select, header button {
    background:#222736; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px 11px; font-size:13.5px; font-family:inherit;
  }
  header select { max-width:38vw; }
  header .grow { flex:1; }
  button.go { border-color:var(--good); color:var(--good); }
  button.save { border-color:var(--gold); color:var(--gold); }

  main { flex:1; overflow-y:auto; padding:14px 14px 24px; }
  .desc { color:var(--dim); font-size:13px; margin-bottom:14px; }

  /* a brick */
  .brick {
    border-radius:10px; margin:0 0 8px; overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
  }
  .brick > .head {
    display:flex; align-items:center; gap:8px; padding:11px 12px;
    font-weight:600; font-size:14px; cursor:pointer;
  }
  .brick .kind {
    font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
    opacity:.75; font-weight:700;
  }
  .brick .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brick .grip { cursor:grab; opacity:.5; font-size:17px; padding:0 2px; touch-action:none; }
  .brick .x { opacity:.6; font-size:16px; padding:0 4px; }
  .k-agent   > .head { background:var(--agent); }
  .k-ask     > .head { background:var(--ask); }
  .k-command > .head { background:var(--command); }
  .k-loop    > .head { background:var(--loop); }

  .body { background:var(--panel); padding:11px 12px; display:none; }
  .brick.open > .body { display:block; }
  .body label { display:block; font-size:11.5px; color:var(--dim); margin:8px 0 3px; }
  .body input, .body select, .body textarea {
    width:100%; background:#0d0f16; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:9px; font-size:14px; font-family:inherit;
  }
  .body textarea { min-height:90px; resize:vertical;
                   font-family:ui-monospace, monospace; font-size:12.5px; }
  .body .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* a loop wraps its children, the way a Scratch C-block does */
  .nest {
    margin:0 0 8px 16px; padding:8px 0 2px 12px;
    border-left:3px solid var(--loop); border-radius:0 0 0 8px;
  }
  .nest .empty {
    color:var(--dim); font-size:12.5px; font-style:italic; padding:6px 0 10px;
  }

  .dropline { height:3px; background:var(--accent); border-radius:2px; margin:2px 0; }
  .dragging { opacity:.4; }

  .palette {
    position:sticky; bottom:0; background:var(--panel);
    border-top:1px solid var(--line); padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:8px; overflow-x:auto;
  }
  .palette button {
    flex:0 0 auto; border:none; border-radius:9px; padding:11px 14px;
    font-size:13.5px; font-weight:600; color:#fff; font-family:inherit;
  }
  .p-agent{background:var(--agent)} .p-ask{background:var(--ask)}
  .p-command{background:var(--command)} .p-loop{background:var(--loop)}

  #toast {
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--good); color:var(--good);
    padding:10px 16px; border-radius:9px; font-size:13.5px; opacity:0;
    transition:opacity .2s; pointer-events:none; z-index:50;
  }
  #toast.show { opacity:1; }
  #toast.err { border-color:var(--bad); color:var(--bad); }
  .hint { color:var(--dim); font-size:12.5px; padding:8px 0 0; }
</style>
</head>
<body>

<header>
  <div class="brand">BRICKS</div>
  <select id="pick"></select>
  <div class="grow"></div>
  <button id="addNew">+ New</button>
  <button class="save" id="saveBtn">Save</button>
  <button class="go" id="runBtn">▶ Run</button>
</header>

<main>
  <div class="desc" id="desc"></div>
  <div id="stack"></div>
  <div class="hint">
    Bricks run top to bottom. Each one's result can be dropped into a later
    brick's text as <code>{name}</code>. <code>{input}</code> is what you type
    when you run it.
  </div>
</main>

<div class="palette">
  <button class="p-agent"   data-add="agent">+ Agent</button>
  <button class="p-ask"     data-add="ask">+ Ask</button>
  <button class="p-command" data-add="command">+ Command</button>
  <button class="p-loop"    data-add="loop">+ Loop</button>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = new URLSearchParams(location.search).get('token')
            || localStorage.getItem('forge-token') || '';
if (new URLSearchParams(location.search).get('token')) {
  localStorage.setItem('forge-token', TOKEN);
  history.replaceState({}, '', location.pathname);
}
const q = p => p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
const api = (p, o) => fetch(q(p), o).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});

let FLOWS = {}, CURRENT = null, MODELS = [], STEPS = [];

function toast(m, bad) {
  const t = $('toast'); t.textContent = m;
  t.className = 'show' + (bad ? ' err' : '');
  setTimeout(() => t.className = '', 2400);
}

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function blank(kind) {
  const n = kind + (Math.floor(Math.random() * 900) + 100);
  if (kind === 'agent')   return { name:n, kind, model:MODELS[0]||'', prompt:'{input}' };
  if (kind === 'ask')     return { name:n, kind, model:MODELS[0]||'', prompt:'{input}', system:'' };
  if (kind === 'command') return { name:n, kind, command:'' };
  return { name:n, kind:'loop', max_rounds:3, until_ok:'', steps:[] };
}

/* ---- rendering ------------------------------------------------------ */

function modelOptions(sel) {
  return MODELS.map(m =>
    `<option value="${esc(m)}"${m === sel ? ' selected' : ''}>${esc(m)}</option>`).join('');
}

function bodyFor(st, path) {
  const p = esc(path);
  if (st.kind === 'command') {
    return `<label>Shell command — its exit code is what a loop checks</label>
      <input data-f="command" data-p="${p}" value="${esc(st.command||'')}"
             placeholder="python3 -m pytest -q">`;
  }
  if (st.kind === 'loop') {
    const names = collectNames(STEPS).filter(n => n !== st.name);
    return `<div class="two">
        <div><label>Give up after</label>
          <input type="number" min="1" max="20" data-f="max_rounds" data-p="${p}"
                 value="${esc(st.max_rounds||3)}"></div>
        <div><label>Repeat until this brick succeeds</label>
          <select data-f="until_ok" data-p="${p}">
            <option value="">(just repeat)</option>
            ${names.map(n => `<option value="${esc(n)}"${st.until_ok===n?' selected':''}>${esc(n)}</option>`).join('')}
          </select></div>
      </div>`;
  }
  // agent / ask
  return `<label>Model</label>
    <select data-f="model" data-p="${p}">${modelOptions(st.model)}</select>
    ${st.kind === 'ask' ? `<label>How it should behave</label>
      <textarea data-f="system" data-p="${p}" style="min-height:60px"
        placeholder="You are a careful reviewer…">${esc(st.system||'')}</textarea>` : ''}
    <label>What to tell it</label>
    <textarea data-f="prompt" data-p="${p}">${esc(st.prompt||'{input}')}</textarea>
    ${st.kind === 'ask' ? `<label>Lock the answer to these words (comma separated, optional)</label>
      <input data-f="choices" data-p="${p}" value="${esc((st.choices||[]).join(', '))}"
             placeholder="SIMPLE, COMPLEX">` : ''}`;
}

function collectNames(steps, out) {
  out = out || [];
  for (const s of steps) {
    out.push(s.name);
    if (s.steps) collectNames(s.steps, out);
  }
  return out;
}

function renderStack(steps, container, prefix) {
  container.innerHTML = '';
  steps.forEach((st, i) => {
    const path = prefix ? `${prefix}.${i}` : `${i}`;
    const el = document.createElement('div');
    el.className = 'brick k-' + st.kind;
    el.dataset.path = path;
    el.innerHTML =
      `<div class="head">
         <span class="grip" draggable="true">⠿</span>
         <span class="kind">${st.kind}</span>
         <span class="name">${esc(st.name)}</span>
         <span class="x">✕</span>
       </div>
       <div class="body">
         <label>Name (other bricks use this as {${esc(st.name)}})</label>
         <input data-f="name" data-p="${esc(path)}" value="${esc(st.name)}">
         ${bodyFor(st, path)}
       </div>`;
    container.appendChild(el);

    el.querySelector('.head').onclick = e => {
      if (e.target.classList.contains('x') || e.target.classList.contains('grip')) return;
      el.classList.toggle('open');
    };
    el.querySelector('.x').onclick = e => {
      e.stopPropagation();
      steps.splice(i, 1);
      draw();
    };
    wireDrag(el, steps, i);

    if (st.kind === 'loop') {
      const nest = document.createElement('div');
      nest.className = 'nest';
      container.appendChild(nest);
      if (!st.steps.length) {
        nest.innerHTML = '<div class="empty">empty — add bricks, then drag them in here</div>';
      } else {
        renderStack(st.steps, nest, path + '.steps');
      }
      const add = document.createElement('div');
      add.className = 'hint';
      add.style.cssText = 'padding:0 0 8px;cursor:pointer;color:var(--accent)';
      add.textContent = '+ add a brick inside this loop';
      add.onclick = () => {
        const kind = prompt('agent, ask, or command?', 'command');
        if (['agent','ask','command'].includes(kind)) { st.steps.push(blank(kind)); draw(); }
      };
      nest.appendChild(add);
    }
  });
}

/* dragging: reorder within the same list. Kept deliberately simple —
   moving a brick between a loop and the top level is done by deleting and
   re-adding, which is less clever but never loses your work. */
let dragFrom = null;
function wireDrag(el, steps, i) {
  const grip = el.querySelector('.grip');
  grip.addEventListener('dragstart', e => {
    dragFrom = { steps, i };
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  grip.addEventListener('dragend', () => { el.classList.remove('dragging'); dragFrom = null; });
  el.addEventListener('dragover', e => {
    if (dragFrom && dragFrom.steps === steps) { e.preventDefault(); }
  });
  el.addEventListener('drop', e => {
    if (!dragFrom || dragFrom.steps !== steps) return;
    e.preventDefault();
    const [moved] = steps.splice(dragFrom.i, 1);
    steps.splice(i, 0, moved);
    draw();
  });
}

function draw() {
  renderStack(STEPS, $('stack'), '');
  $('stack').oninput = onEdit;
  $('stack').onchange = onEdit;
}

function stepAt(path) {
  let cur = { steps: STEPS };
  for (const part of path.split('.')) {
    if (part === 'steps') continue;
    cur = (cur.steps)[parseInt(part, 10)];
  }
  return cur;
}

function onEdit(e) {
  const f = e.target.dataset.f, p = e.target.dataset.p;
  if (!f || p === undefined) return;
  const st = stepAt(p);
  let v = e.target.value;
  if (f === 'max_rounds') v = parseInt(v, 10) || 3;
  if (f === 'choices') {
    const parts = v.split(',').map(x => x.trim()).filter(Boolean);
    if (parts.length) st.choices = parts; else delete st.choices;
    return;
  }
  st[f] = v;
  if (f === 'name') {   // the label at the top should track the field
    const b = document.querySelector(`.brick[data-path="${p}"] .name`);
    if (b) b.textContent = v;
  }
}

/* ---- load / save / run --------------------------------------------- */

async function loadAll() {
  const cfg = await api('/api/config');
  MODELS = Object.keys(cfg.models);
  FLOWS = (await api('/api/pipelines')).pipelines;
  const sel = $('pick');
  sel.innerHTML = Object.keys(FLOWS).map(n => `<option>${esc(n)}</option>`).join('');
  if (!CURRENT || !FLOWS[CURRENT]) CURRENT = Object.keys(FLOWS)[0];
  sel.value = CURRENT;
  open(CURRENT);
}

function open(name) {
  CURRENT = name;
  const f = FLOWS[name];
  if (!f) return;
  STEPS = JSON.parse(JSON.stringify(f.steps || []));
  $('desc').textContent = f.description || '';
  draw();
}

$('pick').onchange = e => open(e.target.value);

$('addNew').onclick = () => {
  const name = prompt('Name for the new recipe?');
  if (!name) return;
  FLOWS[name] = { description: '', steps: [] };
  CURRENT = name;
  $('pick').innerHTML += `<option>${esc(name)}</option>`;
  $('pick').value = name;
  open(name);
};

$('saveBtn').onclick = async () => {
  try {
    await api('/api/pipelines', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: CURRENT, description: $('desc').textContent, steps: STEPS })
    });
    FLOWS[CURRENT] = { description: $('desc').textContent, steps: STEPS };
    toast('Saved ' + CURRENT);
  } catch (e) { toast(e.message, true); }
};

$('runBtn').onclick = async () => {
  const task = prompt('What do you want it to do?');
  if (!task) return;
  const ws = localStorage.getItem('forge-workspace') || '';
  try {
    await api('/api/pipelines', {          // save first, so you run what you see
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: CURRENT, description: $('desc').textContent, steps: STEPS })
    });
    const r = await api('/api/pipelines/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: CURRENT, task, workspace: ws })
    });
    localStorage.setItem('forge-session', r.session);
    location.href = '/chat' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
  } catch (e) { toast(e.message, true); }
};

for (const b of document.querySelectorAll('[data-add]')) {
  b.onclick = () => { STEPS.push(blank(b.dataset.add)); draw(); };
}

loadAll().catch(e => toast('Could not load: ' + e.message, true));
</script>
</body>
</html>
